spring.application.name=project-two

#DB configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/hospital_management
spring.datasource.username=postgres
spring.datasource.password=password

#hibernate 
# in production write validate / none , in dev we can have update
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

#actuator
management.endpoints.web.exposure.include=health, metrics, info, beans, loggers, env
management.endpoint.health.show-details=always